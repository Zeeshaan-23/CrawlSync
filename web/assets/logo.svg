<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Outer Ring with Concurrency Nodes -->
  <circle cx="24" cy="24" r="20" stroke="#242b3b" stroke-width="2" />
  <circle cx="24" cy="24" r="14" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3 3" />
  
  <!-- Synchronized Web Rays -->
  <line x1="24" y1="4" x2="24" y2="44" stroke="#334155" stroke-width="1.5" />
  <line x1="4" y1="24" x2="44" y2="24" stroke="#334155" stroke-width="1.5" />
  <line x1="10" y1="10" x2="38" y2="38" stroke="#334155" stroke-width="1.5" />
  <line x1="10" y1="38" x2="38" y2="10" stroke="#334155" stroke-width="1.5" />
  
  <!-- Central Spider / Scheduler Core -->
  <circle cx="24" cy="24" r="6" fill="url(#brandGrad)" filter="url(#glow)" />
  
  <!-- Concurrency Worker Nodes -->
  <circle cx="24" cy="8" r="3" fill="#38bdf8" />
  <circle cx="40" cy="24" r="3" fill="#10b981" />
  <circle cx="24" cy="40" r="3" fill="#6366f1" />
  <circle cx="8" cy="24" r="3" fill="#38bdf8" />
  <circle cx="35" cy="13" r="2.5" fill="#10b981" />
  <circle cx="35" cy="35" r="2.5" fill="#6366f1" />
  <circle cx="13" cy="35" r="2.5" fill="#38bdf8" />
  <circle cx="13" cy="13" r="2.5" fill="#10b981" />
</svg>

